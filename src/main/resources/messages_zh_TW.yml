format:
  prefix: "<dark_gray>[<aqua>WorldManagement</aqua>]</dark_gray> "
command:
  root:
    usage: "<gray>用法：</gray><white>/wm <help|adopt|create|load|unload|remove|manage|import|delete|identity|display-name|tp|warp|ownership|storage|list></white>"
    unknown: "<prefix><red>未知的 WorldManagement 子指令。</red>"
  help:
    page-header: "<aqua>WorldManagement 指令幫助</aqua> <gray>第 <page>/<pages> 頁</gray>"
    page-entry: "<yellow>/wm help <topic></yellow><gray> - </gray><description>"
    topic-header: "<aqua>/wm <topic></aqua><gray> - </gray><description>"
    usage: "<gray>用法：</gray><white><usage></white>"
    children: "<gray>子指令：</gray><white><children></white>"
    permissions: "<gray>權限：</gray><white><permissions></white>"
    invalid-page: "<prefix><red>無效的幫助頁碼：<white><page></white>。</red>"
    not-found: "<prefix><red>找不到可查看的指令幫助。</red>"
    topic:
      help:
        description: "查看可用指令、分頁或指定指令路徑的說明。"
      create:
        description: "建立新世界並加入 WorldManagement 管理。"
      adopt:
        description: "接管已載入但尚未註冊的世界。"
      load:
        description: "載入受管世界。"
      unload:
        description: "卸載受管世界，可指定 fallback 世界。"
      remove:
        description: "停止管理世界，或確認清除 detached metadata。"
      manage:
        description: "將 detached 世界重新加入管理。"
      import:
        description: "從既有世界目錄匯入世界。"
      delete:
        description: "經確認流程永久刪除受管世界。"
      identity:
        description: "查看或修復世界識別狀態。"
        show:
          description: "顯示世界識別快照與驗證狀態。"
        sync:
          description: "同步待確認的世界識別快照。"
        accept-replacement:
          description: "接受 replacement identity 並選擇 Warp 處理方式。"
        abandon:
          description: "停止管理識別異常的世界。"
      display-name:
        description: "管理世界的可顯示名稱。"
        set:
          description: "設定世界顯示名稱。"
        reset:
          description: "重設世界顯示名稱。"
      tp:
        description: "將自己或其他線上玩家傳送至受管世界。"
        self:
          description: "將自己傳送至受管世界。"
        player:
          description: "將指定線上玩家傳送至受管世界。"
        any:
          description: "以明確 bypass 權限略過世界進入限制。"
      warp:
        description: "管理與使用世界傳送點。"
        list:
          description: "列出世界傳送點。"
        set:
          description: "在目前位置建立世界傳送點。"
        delete:
          description: "刪除世界傳送點。"
        tp:
          description: "傳送至可見的世界傳送點。"
        trust:
          description: "管理私人傳送點的信任名單。"
      ownership:
        description: "管理世界擁有者、階級與存取規則。"
        owner:
          description: "設定或移除世界擁有者。"
          set:
            description: "設定世界擁有者。"
          remove:
            description: "移除世界擁有者。"
        rank:
          description: "管理世界自訂階級與成員階級。"
          create:
            description: "建立世界自訂階級。"
          delete:
            description: "刪除世界自訂階級。"
          set:
            description: "設定線上玩家的世界階級。"
          remove:
            description: "移除線上玩家的世界階級。"
          perm:
            description: "新增或移除世界階級權限。"
          toggle:
            description: "切換世界階級系統。"
        access:
          description: "管理世界 access mode 與名單。"
      storage:
        description: "管理 metadata 儲存工具。"
        migrate:
          description: "驗證並遷移 metadata provider。"
      list:
        description: "列出受管世界。"
        detached:
          description: "列出已停止管理的世界。"
  syntax:
    missing: "<prefix><red>指令缺少必要參數。</red>"
    invalid: "<prefix><red>指令包含無效的子指令或參數。</red>"
    extra: "<prefix><red>指令包含多餘參數。</red>"
    help-hint: "<gray>查看說明：</gray><white>/wm help<topic></white>"
  loading: "<prefix><yellow>WorldManagement 正在載入資料。</yellow>"
  permission:
    create: "<prefix><red>你沒有建立世界的權限。</red>"
    remove: "<prefix><red>你沒有移除世界的權限。</red>"
    manage: "<prefix><red>你沒有重新管理世界的權限。</red>"
    import: "<prefix><red>你沒有匯入世界的權限。</red>"
    delete: "<prefix><red>你沒有刪除世界的權限。</red>"
    identity-show: "<prefix><red>你沒有查看世界識別資訊的權限。</red>"
    identity-sync: "<prefix><red>你沒有同步世界識別資訊的權限。</red>"
    identity-accept: "<prefix><red>你沒有接受replacement world的權限。</red>"
    identity-abandon: "<prefix><red>你沒有停止管理識別異常世界的權限。</red>"
    display-name-set: "<prefix><red>你沒有設定世界顯示名稱的權限。</red>"
    display-name-reset: "<prefix><red>你沒有重設世界顯示名稱的權限。</red>"
    lifecycle: "<prefix><red>你沒有執行 <operation> 世界操作的權限。</red>"
    tp: "<prefix><red>你沒有傳送至世界的權限。</red>"
    tp-others: "<prefix><red>你沒有傳送其他玩家的權限。</red>"
    tp-any: "<prefix><red>你沒有略過世界進入限制的權限。</red>"
    adopt: "<prefix><red>你沒有接管世界的權限。</red>"
    list: "<prefix><red>你沒有列出受管世界的權限。</red>"
  create:
    usage: "<gray>用法：</gray><white>/wm create <world> [NORMAL|NETHER|THE_END] [NORMAL|FLAT|AMPLIFIED|LARGE_BIOMES] [seed]</white>"
    started: "<prefix><yellow>正在建立世界 <white><world></white>...</yellow>"
    invalid: "<prefix><red>世界建立參數無效。</red>"
    success: "<prefix><green>世界 <white><world></white> 已建立並加入管理。</green>"
    failure: "<prefix><red>無法建立世界 <white><world></white>。</red>"
  lifecycle:
    usage: "<gray>用法：</gray><white>/wm <operation> <world></white>"
    success: "<prefix><green>世界 <white><world></white> 已<result>。</green>"
    failure: "<prefix><red>無法對世界 <white><world></white> 執行 <operation>。</red>"
  remove:
    usage: "<gray>用法：</gray><white>/wm remove <world> | /wm remove <world> purge confirm</white>"
    success: "<prefix><green>世界 <white><world></white> 已停止管理，世界檔案與 metadata 仍保留。</green>"
    failure: "<prefix><red>無法移除世界 <white><world></white>。</red>"
    purge-success: "<prefix><green>已永久清除已停止管理世界 <white><world></white> 的 metadata。</green>"
    purge-failure: "<prefix><red>只能清除已停止管理世界的 metadata。</red>"
  manage:
    usage: "<gray>用法：</gray><white>/wm manage <world></white>"
    success: "<prefix><green>世界 <white><world></white> 已重新加入管理。</green>"
    failure: "<prefix><red>世界 <white><world></white> 不在已停止管理清單中。</red>"
  import:
    usage: "<gray>用法：</gray><white>/wm import <world> <NORMAL|NETHER|THE_END></white>"
    not-importable: "<prefix><red>世界目錄不可匯入。</red>"
    success: "<prefix><green>世界 <white><world></white> 已匯入並加入管理。</green>"
    failure: "<prefix><red>無法匯入世界 <white><world></white>。</red>"
  delete:
    confirm: "<yellow>請使用 <white>/wm delete <world> [fallback] confirm</white> 確認刪除。</yellow>"
    success: "<prefix><green>世界 <white><world></white> 已永久刪除。</green>"
    pending-restart: "<prefix><yellow>世界 <white><world></white> 已移入安全隔離區；將於下次伺服器啟動時完成刪除。</yellow>"
    unloaded-requires-confirmation: "<prefix><yellow>世界 <white><world></white> 已完成存檔並卸載。請再次執行相同刪除指令以永久刪除。</yellow>"
    reloaded: "<prefix><yellow>世界 <white><world></white> 在刪除流程中被重新載入，已中止刪除並保留資料。</yellow>"
    failure: "<prefix><red>無法刪除世界 <white><world></white>。</red>"
    players-present: "<prefix><red>世界 <white><world></white> 仍有玩家，無法刪除。</red>"
    not-managed: "<prefix><red>世界 <white><world></white> 不在管理中。</red>"
    not-loaded: "<prefix><red>世界 <white><world></white> 尚未載入。</red>"
    storage-not-found: "<prefix><red>找不到世界 <white><world></white> 的資料目錄。</red>"
    unload-failed: "<prefix><red>無法卸載世界 <white><world></white>。</red>"
    metadata-failed: "<prefix><red>無法更新世界 <white><world></white> 的刪除狀態；資料已保留或還原，請檢查伺服器紀錄。</red>"
    fallback-unavailable: "<prefix><red>刪除前需要另一個已載入的 fallback 世界。</red>"
    identity-not-verified: "<prefix><red>世界 <white><world></white> 的識別尚未驗證，不能刪除。</red>"
    external-only: "<prefix><red>世界 <white><world></white> 由外部系統管理生命週期，WorldManagement 不會刪除。</red>"
    operation-in-progress: "<prefix><yellow>世界 <white><world></white> 已有其他生命週期操作進行中。</yellow>"
  identity:
    usage: "<gray>用法：</gray><white>/wm identity show <world> | sync <world> | accept-replacement <world> confirm <clear-warps|keep-warps> | abandon <world> confirm</white>"
    not-managed: "<prefix><red>世界 <white><world></white> 沒有 WorldManagement metadata。</red>"
    show: "<aqua>世界識別：</aqua><white><world></white> <gray>| key:</gray> <white><key></white> <gray>| UUID:</gray> <white><uuid></white> <gray>| environment:</gray> <white><environment></white> <gray>| seed:</gray> <white><seed></white> <gray>| structures:</gray> <white><structures></white> <gray>| state:</gray> <white><state></white> <gray>| capability:</gray> <white><capability></white> <gray>| pending:</gray> <white><pending></white>"
    sync:
      success: "<prefix><green>世界 <white><world></white> 的pending identity snapshot已同步。</green>"
      not-pending: "<prefix><red>世界 <white><world></white> 目前不是SYNC_PENDING，不能同步。</red>"
      stale: "<prefix><yellow>世界 <white><world></white> 的pending identity已變更，請重新檢查後再執行。</yellow>"
      failure: "<prefix><red>無法同步世界 <white><world></white> 的識別資訊。</red>"
    accept:
      success: "<prefix><green>已接受世界 <white><world></white> 的replacement identity；Warp policy：<white><policy></white>。</green>"
      not-conflict: "<prefix><red>世界 <white><world></white> 目前不是CONFLICT，不能接受replacement。</red>"
      index-conflict: "<prefix><red>Replacement identity與其他metadata的Paper key或UUID衝突，未進行任何變更。</red>"
      stale: "<prefix><yellow>世界 <white><world></white> 的replacement identity已變更，請重新檢查後再執行。</yellow>"
      failure: "<prefix><red>無法接受世界 <white><world></white> 的replacement identity。</red>"
    abandon:
      success: "<prefix><green>世界 <white><world></white> 的metadata已轉為DETACHED；runtime world與檔案未變更。</green>"
      not-allowed: "<prefix><red>只能停止管理處於SYNC_PENDING或CONFLICT的ACTIVE metadata。</red>"
      stale: "<prefix><yellow>世界 <white><world></white> 的identity state已變更，請重新檢查後再執行。</yellow>"
      failure: "<prefix><red>無法停止管理世界 <white><world></white> 的metadata。</red>"
  display-name:
    usage: "<gray>用法：</gray><white>/wm display-name set <world> <display-name...> | reset <world></white>"
    not-managed: "<prefix><red>世界 <white><world></white> 不在管理中。</red>"
    invalid: "顯示名稱無效。"
    set-success: "<prefix><green>世界 <white><world></white> 的顯示名稱已設為 <display>。</green>"
    reset-success: "<prefix><green>世界 <white><world></white> 的顯示名稱已重設。</green>"
    failure: "<prefix><red>無法更新世界 <white><world></white> 的顯示名稱。</red>"
  audit-rejected: "<prefix><red>操作無法完成稽核，因此未開始執行。</red>"
  storage:
    usage: "<gray>用法：</gray><white>/wm storage migrate <source> <target> confirm</white>"
    unknown-provider: "<prefix><red>未知的儲存供應者。</red>"
    success: "<prefix><green>已遷移 <count> 筆世界 metadata。請更新 storage.provider 並重新啟動以啟用目標儲存。</green>"
    failure: "<prefix><red>儲存遷移失敗，請檢查伺服器紀錄。</red>"
  world-name-invalid: "<prefix><red>世界名稱無效。</red>"
  adopt:
    usage: "<gray>用法：</gray><white>/wm adopt <world></white>"
    loaded-only: "<prefix><red>只能接管已載入的世界。</red>"
    started: "<prefix><yellow>正在登錄世界 <white><world></white> 的 metadata...</yellow>"
    failure: "<prefix><red>無法登錄世界 metadata，請檢查伺服器紀錄。</red>"
    success: "<prefix><green>世界 <white><world></white> 已加入管理。</green>"
    already-managed: "<prefix><yellow>世界 <white><world></white> 已在管理中。</yellow>"
  list:
    empty: "<prefix><gray>目前沒有受 WorldManagement 管理的世界。</gray>"
    result: "<aqua>受管世界：</aqua><white><worlds></white>"
    detached-empty: "<prefix><gray>目前沒有已停止管理的世界。</gray>"
    detached-result: "<aqua>已停止管理世界：</aqua><white><worlds></white>"
  tp:
    usage: "<gray>用法：</gray><white>/wm tp <self|player <online-player>|--any> <world> [x y z]</white>"
    player-only: "<prefix><red>只有玩家能傳送自己；請用 player 指定線上玩家。</red>"
    player-not-online: "<prefix><red>目標玩家必須在線上。</red>"
    not-managed: "<prefix><red>世界 <white><world></white> 不在管理中。</red>"
    denied: "<prefix><red>目標玩家沒有進入世界 <white><world></white> 的權限。</red>"
    success: "<prefix><green>已傳送至世界 <white><world></white>。</green>"
    failure: "<prefix><red>無法傳送至世界 <white><world></white>。</red>"
warp:
  disabled: "<prefix><red>世界傳送點功能已停用。</red>"
  usage: "<gray>用法：</gray><white>/wm warp <set|delete|tp|list|trust> ...</white>"
  permission: "<prefix><red>你沒有使用世界傳送點的權限。</red>"
  list:
    usage: "<gray>用法：</gray><white>/wm warp list <world></white>"
    empty: "<prefix><gray>此世界沒有傳送點。</gray>"
    result: "<aqua>傳送點：</aqua><white><warps></white>"
  set:
    player-only: "<prefix><red>只有玩家能在目前位置設定傳送點。</red>"
    usage: "<gray>用法：</gray><white>/wm warp set <world> <name> <PUBLIC|PRIVATE></white>"
    wrong-world: "<prefix><red>你必須位於目標世界才能設定其傳送點。</red>"
    success: "<prefix><green>傳送點 <white><warp></white> 已儲存。</green>"
    failure: "<prefix><red>無法儲存傳送點。</red>"
    invalid: "<prefix><red>傳送點名稱或可見性無效。</red>"
  delete:
    usage: "<gray>用法：</gray><white>/wm warp delete <world> <name></white>"
    success: "<prefix><green>傳送點 <white><warp></white> 已刪除。</green>"
    failure: "<prefix><red>無法刪除傳送點。</red>"
  teleport:
    usage: "<gray>用法：</gray><white>/wm warp tp <world> <name></white>"
    failure: "<prefix><red>無法傳送至該傳送點。</red>"
  trust:
    usage: "<gray>用法：</gray><white>/wm warp trust <world> <warp> <add|remove> <player-name-or-uuid></white>"
    success: "<prefix><green>傳送點信任名單已更新。</green>"
    failure: "<prefix><red>無法更新傳送點信任名單。</red>"
    invalid: "<prefix><red>信任操作或線上玩家名稱／UUID 無效。</red>"
  world-not-managed: "<prefix><red>世界不在管理中。</red>"
  not-manager: "<prefix><red>你不是此世界的管理者。</red>"
ownership:
  owner:
    usage: "<gray>用法：</gray><white>/wm ownership owner <set|remove> <world> [player-name-or-uuid]</white>"
    success: "<prefix><green>世界擁有者已更新。</green>"
    failure: "<prefix><red>無法更新世界擁有者。</red>"
    invalid: "<prefix><red>擁有者操作或線上玩家名稱／UUID 無效。</red>"
  access:
    usage: "<gray>用法：</gray><white>/wm ownership access <world> <mode|add|remove> <NONE|WHITELIST|BLACKLIST|player-name-or-uuid></white>"
    success: "<prefix><green>世界存取設定已更新。</green>"
    failure: "<prefix><red>無法更新世界存取設定。</red>"
    invalid: "<prefix><red>世界存取參數無效。</red>"
  rank:
    usage: "<gray>用法：</gray><white>/wm ownership rank <create|delete|set|remove|perm|toggle> <world> ...</white>"
    success: "<prefix><green>世界階級設定已更新。</green>"
    failure: "<prefix><red>無法更新世界階級設定。</red>"
    invalid: "<prefix><red>世界階級參數無效。</red>"
  world-not-managed: "<prefix><red>世界不在管理中。</red>"
  not-manager: "<prefix><red>你不是此世界的管理者。</red>"