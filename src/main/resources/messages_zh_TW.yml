term:
  management:
    active: "受管"
    detached: "已停止管理"
    unknown: "未知"
  environment:
    normal: "主世界"
    nether: "地獄"
    the-end: "終界"
    custom: "自訂"
  identity:
    verified: "已驗證"
    sync-pending: "等待同步"
    conflict: "衝突"
  capability:
    managed: "可管理"
    external-only: "僅外部管理"
  common:
    none: "無"
    yes: "是"
    no: "否"
  policy:
    keep-warps: "保留世界傳送點"
    clear-warps: "清除世界傳送點"
  operation:
    load: "載入"
    unload: "卸載"
  result:
    loaded: "載入"
    unloaded: "卸載"
format:
  prefix: "<dark_gray>[<aqua>WorldManagement</aqua>]</dark_gray> "
command:
  root:
    usage: "<gray>用法：</gray><white>/wm <help|adopt|create|load|unload|remove|manage|import|delete|identity|display-name|tp|warp|ownership|storage|list></white>"
    unknown: "<prefix><red>未知的 WorldManagement 子指令。</red>"
  help:
    page-header: "<aqua>WorldManagement 指令幫助</aqua> <gray>第 <page>/<pages> 頁</gray>"
    page-entry: "<yellow>/wm help <topic></yellow><gray> - </gray><description>"
    topic-header: "<aqua>/wm <topic></aqua><gray> - </gray><description>"
    usage: "<gray>用法：</gray><white><usage></white>"
    children: "<gray>子指令：</gray><white><children></white>"
    permissions: "<gray>權限：</gray><white><permissions></white>"
    invalid-page: "<prefix><red>無效的幫助頁碼：<white><page></white>。</red>"
    not-found: "<prefix><red>找不到可查看的指令幫助。</red>"
    topic:
      help:
        description: "查看可用指令、分頁或指定指令路徑的說明。"
      create:
        description: "建立新世界並加入 WorldManagement 管理。"
      adopt:
        description: "接管已載入但尚未註冊的世界。"
        detached:
          description: "接管已載入世界並保留為停止治理狀態。"
      load:
        description: "載入已註冊世界，或以 <term:management.detached> 模式載入既有世界。"
      unload:
        description: "卸載已註冊或目前已載入的世界，可指定備援世界。"
      remove:
        description: "停止管理世界，或確認清除 <term:management.detached>世界的中繼資料。"
      manage:
        description: "將<term:management.detached>的世界重新加入管理。"
      import:
        description: "從既有世界目錄匯入世界。"
        detached:
          description: "匯入世界並保留為停止治理狀態。"
      delete:
        description: "經二次確認後刪除已註冊或目前已載入的世界。"
      identity:
        description: "查看或修復世界識別狀態。"
        show:
          description: "顯示世界識別快照與驗證狀態。"
        sync:
          description: "同步待確認的世界識別快照。"
        accept-replacement:
          description: "接受替代世界識別，並選擇世界傳送點的處理方式。"
        abandon:
          description: "停止管理識別異常的世界。"
      display-name:
        description: "管理世界的可顯示名稱。"
        set:
          description: "設定世界顯示名稱。"
        reset:
          description: "重設世界顯示名稱。"
      tp:
        description: "將自己或其他線上玩家傳送至<term:management.active>或<term:management.detached>世界。"
        self:
          description: "將自己傳送至<term:management.active>或<term:management.detached>世界。"
        player:
          description: "將指定線上玩家傳送至<term:management.active>或<term:management.detached>世界。"
        any:
          description: "以明確的略過權限忽略世界進入限制。"
      warp:
        description: "管理與使用世界傳送點。"
        list:
          description: "列出世界傳送點。"
        set:
          description: "在目前位置建立世界傳送點。"
        delete:
          description: "刪除世界傳送點。"
        tp:
          description: "傳送至可見的世界傳送點。"
        trust:
          description: "管理私人傳送點的信任名單。"
      ownership:
        description: "管理世界擁有者、階級與存取規則。"
        owner:
          description: "設定或移除世界擁有者。"
          set:
            description: "設定世界擁有者。"
          remove:
            description: "移除世界擁有者。"
        rank:
          description: "管理世界自訂階級與成員階級。"
          create:
            description: "建立世界自訂階級。"
          delete:
            description: "刪除世界自訂階級。"
          set:
            description: "設定線上玩家的世界階級。"
          remove:
            description: "移除線上玩家的世界階級。"
          perm:
            description: "新增或移除世界階級權限。"
          toggle:
            description: "切換世界階級系統。"
        access:
          description: "管理世界存取模式與名單。"
      storage:
        description: "管理中繼資料儲存工具。"
        migrate:
          description: "驗證並遷移中繼資料儲存供應者。"
      list:
        description: "列出受管世界。"
        detached:
          description: "列出已停止管理的世界。"
        all:
          description: "列出目前所有已載入的執行中世界與管理狀態。"
