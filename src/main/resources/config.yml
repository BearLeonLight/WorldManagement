schema-version: 1
storage:
  provider: YAML
  jdbc-url: ""
  username: ""
  password: ""
  yaml:
    retained-backups-per-world: 20
lifecycle:
  fallback-world: ""
  deletion-delay-milliseconds: 1000
ownership:
  default-rank-system-enabled: true
  maximum-custom-ranks: 5
warp:
  enabled: true
audit:
  policy: BEST_EFFORT
  file:
    max-file-size-mib: 10
    retained-files: 10
debug:
  level: OFF
  sinks:
    console: true
    file: true
  areas: [STARTUP, METADATA, AUDIT, IO, COMMAND, LIFECYCLE, WARP, OWNERSHIP, PROTECTION, STORAGE]
  file:
    max-file-size-mib: 10
    retained-files: 5
  privacy:
    include-player-names: false
    include-masked-ip-addresses: false
    include-masked-jdbc-endpoints: false
locale: zh_TW
storage-migration:
  targets: {}
